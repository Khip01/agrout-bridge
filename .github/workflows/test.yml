name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Dart analyze + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Get dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Run unit tests
        run: dart test test/profile_test.dart test/waf_test.dart test/sse_test.dart test/circuit_test.dart test/usage_store_test.dart

      - name: Smoke build (linux)
        run: mkdir -p bin-executables && dart compile exe bin/agrout_bridge.dart -o bin-executables/app-linux

      - name: Upload linux binary
        uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: bin-executables/app-linux
