name: Post-release validation

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  install-sim:
    name: Install from real published tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download tarball from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF_NAME:-main}
          if [ "$TAG" = "main" ]; then
            TAG=$(curl -sS -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)
          fi
          echo "Release: $TAG"
          gh release download "$TAG" --pattern 'agrout-bridge-*.tgz' --dir .
          ls -la agrout-bridge-*.tgz

      - name: Install to isolated prefix
        run: |
          mkdir -p _prefix
          npm install --prefix _prefix -g ./agrout-bridge-*.tgz 2>&1 | tail -5
          ls -la _prefix/bin/

      - name: Verify binary exists
        run: |
          # The npm-installed bin is a symlink to .../bin/agrout-bridge.js;
          # follow the link so we execute the Node launcher (which in turn
          # spawns the native binary).
          BIN=$(find -L _prefix -name 'agrout-bridge' -type f 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            BIN=$(find _prefix -name 'agrout-bridge' 2>/dev/null | head -1)
          fi
          test -n "$BIN" || (echo "agrout-bridge binary not found" && exit 1)
          echo "Found: $BIN"
          "$BIN" --version
          "$BIN" help | head -5

      - name: Cleanup
        if: always()
        run: |
          rm -rf _prefix
